# ============================================
# Vectrax Production — Docker Compose
# ============================================
# Single command: docker-compose up -d
#
# Services:
#   vectrax   — core + gateway (long-poll OR webhook mode via USE_WEBHOOK env)
#   caddy     — HTTPS reverse proxy (only needed for webhook mode)
# ============================================


services:
  vectrax:
    build: .
    container_name: vectrax-core
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - VX_ENV=production
    ports:
      # Kept bound to host for local curl/debug; public traffic goes via caddy:443
      - "8900:8900"
    volumes:
      # Code mount: rsync deploys reemplazan código, NO datos.
      # Excluir vault/, data/, logs/ del rsync (deploy_vultr.sh) para que
      # las dbs operativas no se sobrescriban.
      - ./:/app
      # === RUNTIME PERSISTENT VOLUME ===
      # Sobrevive 'docker compose down/up' y 'down --rmi all'.
      # SE PIERDE solo con 'docker compose down -v' o 'docker volume rm'.
      # Contiene:
      #   continuity.db        — idempotencia update_id Telegram
      #   anti_repetition.db   — ring buffer 10 últimas respuestas/user
      #   vectrax.db           — user_memory + fact_memory + leads
              # gravity.db           — deep_memory + identidades + esenciales
      #   sovereignty.jsonl    — audit log de envios
      #   gateway_heartbeat    — heartbeat para watchdog
      #   worker_heartbeat     — idem
      #   gateway.log + worker.log + supervisor.log
      #   vctx_identity (seed) — quien es Mario, su sistema, su misión
      # Backup: scripts/backup_runtime.sh tarball completo.
      - vectrax-runtime:/root/.vectrax
    labels:
      - "vectrax.runtime.persist=true"
    networks:
      - vectrax-net
    healthcheck:
      # Probe the REAL HTTP surface (core_api on :8900), not just the supervisor
      # PID. A hung-but-alive core_api now reports 'unhealthy' in `docker ps`.
      # Auto-recovery is handled in-process by the supervisor's
      # _check_core_api_http(); this is the accurate status signal.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8900/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
        reservations:
          memory: 512M

  # Reverse proxy with automatic Let's Encrypt TLS.
  # OPTIONAL: only needed for production HTTPS with a real domain.
  # Start with:  docker compose --profile tls up -d
  # If using a temporary tunnel (cloudflared, ngrok) Caddy is not required.
  caddy:
    image: caddy:2-alpine
    container_name: vectrax-caddy
    restart: unless-stopped
    profiles:
      - tls
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data            # stores Let's Encrypt certs
      - caddy-config:/config         # Caddy runtime config
      - caddy-logs:/var/log/caddy    # access logs
    networks:
      - vectrax-net
    depends_on:
      - vectrax

volumes:
  # Volume PERSISTENTE — contiene la identidad, memoria y continuidad
  # de Vectrax. NO borrar excepto en bootstrap.
  #
  # ⚠️  WARNING: `docker compose down -v` DESTRUYE este volumen.
  #    Ejecutar `bash scripts/protect_volume.sh` ANTES de cualquier
  #    operación destructiva. No hay forma de recuperar sin backup.
  vectrax-runtime:
    labels:
      - "vectrax.role=runtime-state"
      - "vectrax.persist=critical"
  caddy-data:
  caddy-config:
  caddy-logs:

networks:
  vectrax-net:
    driver: bridge
