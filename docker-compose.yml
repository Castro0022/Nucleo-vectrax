# ============================================
# Vectrax Production — Docker Compose
# ============================================
# Single command: docker-compose up -d
# ============================================


services:
  vectrax:
    build: .
    container_name: vectrax-core
    restart: unless-stopped
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    volumes:
      - ./vault:/app/vault
      - vectrax-runtime:/root/.vectrax
    healthcheck:
      test: ["CMD", "python", "/app/vectrax_supervisor.py", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 256M

volumes:
  vectrax-runtime:
