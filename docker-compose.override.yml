# Vectrax — Docker Compose Dev Override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.override.yml up

version: "3.8"

services:
  core:
    build:
      target: runtime
    environment:
      - VX_ENV=local
      - VX_LOG_LEVEL=DEBUG
    volumes:
      # Mount source code for hot reload
      - .:/app:cached
      - vectrax-data:/home/vectrax/.vectrax
    command: ["python", "-m", "services.runtime"]
