<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vectrax — Observatory</title>
<style>
:root {
  --bg: #060a10; --surface: #0e1420; --border: #1a2235;
  --text: #d1d5db; --dim: #5a6374; --accent: #4f8ff7;
  --core: #fbbf24; --market: #06d6a0; --interest: #22d3ee;
  --warn: #f59e0b; --danger: #ef4444; --success: #10b981;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'SF Mono', Menlo, Consolas, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.header {
  padding: 20px 24px; display: flex; align-items: center; gap: 16px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(14,20,32,0.95) 0%, var(--bg) 100%);
}
.header .logo { font-size: 20px; font-weight: 800; color: var(--accent); }
.header .subtitle { font-size: 13px; color: var(--dim); }
.header .status { margin-left: auto; font-family: var(--mono); font-size: 12px; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.status-healthy { background: var(--success); box-shadow: 0 0 6px var(--success); }
.status-degraded { background: var(--warn); }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; padding: 20px 24px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 20px; overflow: hidden;
}
.card-title {
  font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
}
.card-title .icon { font-size: 16px; }

.metric { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(26,34,53,0.5); font-size: 13px; }
.metric:last-child { border-bottom: none; }
.metric .label { color: var(--dim); }
.metric .value { font-family: var(--mono); font-weight: 600; }
.metric .value.accent { color: var(--accent); }
.metric .value.market { color: var(--market); }
.metric .value.warn { color: var(--warn); }
.metric .value.success { color: var(--success); }
.metric .value.danger { color: var(--danger); }

.section-title {
  grid-column: 1 / -1; font-size: 16px; font-weight: 700; color: var(--text);
  padding: 12px 0 4px 0; border-top: 1px solid var(--border); margin-top: 8px;
}

table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; color: var(--dim); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--border); }
td { padding: 5px 8px; border-bottom: 1px solid rgba(26,34,53,0.3); font-family: var(--mono); }
.domain-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

.empty { color: var(--dim); font-style: italic; font-size: 12px; padding: 8px 0; }
.nav-links { display: flex; gap: 16px; padding: 8px 24px 0; font-size: 13px; }

@keyframes flash { 0%{background:rgba(79,143,247,0.3)} 100%{background:transparent} }
@keyframes pulse-glow { 0%,100%{box-shadow:0 0 4px var(--success)} 50%{box-shadow:0 0 12px var(--success)} }
.val-changed { animation: flash 1.5s ease-out; border-radius: 3px; }
.pulse-active { animation: pulse-glow 2s infinite; }
.countdown { font-family: var(--mono); font-size: 11px; color: var(--warn); padding: 2px 8px; border: 1px solid var(--border); border-radius: 4px; }
.live-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--success); margin-right:4px; animation: pulse-glow 2s infinite; }
</style>
</head>
<body>

<div class="header">
  <span class="logo">✦ VECTRAX OBSERVATORY</span>
  <span class="subtitle">Centro de observación del universo cognitivo</span>
  <span class="status" id="status"><span class="status-dot"></span>Cargando...</span>
</div>
<div class="nav-links">
  <a href="/universe/view">🌌 Universe</a>
  <a href="/">← Vectrax</a>
  <span id="cycle-countdown" class="countdown" style="margin-left:auto"></span>
  <span style="color:var(--dim);font-family:var(--mono);font-size:11px" id="refresh-info"></span>
</div>

<div class="grid" id="dashboard">
  <div class="card"><div class="card-title">Cargando datos...</div></div>
</div>

<script>
(function() {
  'use strict';
  const grid = document.getElementById('dashboard');
  const statusEl = document.getElementById('status');
  const refreshEl = document.getElementById('refresh-info');
  const countdownEl = document.getElementById('cycle-countdown');

  // Track previous values for change detection
  let _prev = {};
  function trackVal(key, val) {
    const changed = _prev[key] !== undefined && _prev[key] !== val;
    _prev[key] = val;
    return changed;
  }

  // Cycle countdown (30 min = 1800s)
  let _lastCycleTs = 0;
  const CYCLE_INTERVAL = 1800;
  function updateCountdown() {
    if (!_lastCycleTs) { countdownEl.textContent = ''; return; }
    const elapsed = Math.floor(Date.now()/1000 - _lastCycleTs);
    const remaining = Math.max(0, CYCLE_INTERVAL - elapsed);
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    countdownEl.innerHTML = `<span class="live-dot"></span>Pr\u00f3ximo ciclo: ${m}:${s.toString().padStart(2,'0')}`;
    if (remaining === 0) countdownEl.innerHTML = `<span class="live-dot"></span>Ciclo ejecut\u00e1ndose...`;
  }
  setInterval(updateCountdown, 1000);

  const DOMAIN_COLORS = {
    market: '#06d6a0', user_interest: '#22d3ee', unknown: '#4f8ff7',
    services: '#a78bfa', tests: '#6b7280',
  };

  function fmt(n, dec=0) { return typeof n === 'number' ? n.toFixed(dec) : (n || '—'); }
  function pct(n) { return typeof n === 'number' ? n.toFixed(1) + '%' : '—'; }
  function ago(ts) {
    if (!ts) return '—';
    const s = Math.floor(Date.now()/1000 - ts);
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  }

  function metric(label, value, cls='', key='') {
    const changed = key && trackVal(key, value);
    const flash = changed ? ' val-changed' : '';
    return `<div class="metric${flash}"><span class="label">${label}</span><span class="value ${cls}">${value}</span></div>`;
  }

  function card(icon, title, content) {
    return `<div class="card"><div class="card-title"><span class="icon">${icon}</span>${title}</div>${content}</div>`;
  }

  function sectionTitle(text) {
    return `<div class="section-title">${text}</div>`;
  }

  function domainDot(domain) {
    const c = DOMAIN_COLORS[domain] || '#4f8ff7';
    return `<span class="domain-dot" style="background:${c}"></span>`;
  }

  async function load() {
    try {
      const res = await fetch('/v1/dashboard/observatory');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const d = await res.json();
      render(d);
      const st = d.operator?.status || 'unknown';
      const cls = st === 'healthy' ? 'status-healthy' : 'status-degraded';
      statusEl.innerHTML = `<span class="status-dot ${cls}"></span>${st.toUpperCase()}`;
      refreshEl.textContent = new Date().toLocaleTimeString();
    } catch (e) {
      statusEl.innerHTML = `<span class="status-dot status-degraded"></span>ERROR: ${e.message}`;
    }
  }

  function render(d) {
    const g = d.gravity || {};
    const m = d.market || {};
    const u = d.users || {};
    const c = d.convergences || {};
    const op = d.operator || {};
    const lg = d.legacy || {};

    let html = '';

    // === RESUMEN GENERAL ===
    html += sectionTitle('📊 Resumen General');

    const sb = d.star_breakdown || {};
    html += card('⭐', 'Universo', [
      metric('Estrellas totales', fmt(d.total_stars), 'accent', 'u_stars'),
      metric('• Gravitacionales', fmt(sb.gravitational || g.total), '', 'u_grav'),
      metric('• Knowledge', fmt(sb.knowledge || lg.knowledge_stars), '', 'u_know'),
      metric('• Usuarios', fmt(sb.users || lg.user_stars), '', 'u_user'),
      metric('Patrones', fmt(lg.patterns), '', 'u_pat'),
      metric('Constelaciones', fmt(lg.constellations), '', 'u_const'),
    ].join(''));

    // Observation Bias card
    const bias = d.observation_bias || {};
    let biasHtml = '';
    if (Object.keys(bias).length) {
      for (const [dom, w] of Object.entries(bias).sort((a,b) => b[1]-a[1])) {
        const pct = Math.min(w / 3.0 * 100, 100);
        const col = w >= 1.5 ? 'var(--success)' : w < 0.8 ? 'var(--danger)' : 'var(--accent)';
        biasHtml += `<div style="padding:3px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${dom}</span><span style="font-family:var(--mono);color:${col}">${w.toFixed(2)}</span></div><div style="height:3px;background:rgba(26,34,53,0.8);border-radius:2px;margin-top:2px"><div style="height:100%;width:${pct}%;background:${col};border-radius:2px"></div></div></div>`;
      }
    } else {
      biasHtml = '<div class="empty">Sin datos de bias</div>';
    }
    const learn = d.learning || {};
    if (learn.interactions_until_refine !== undefined) {
      biasHtml += `<div style="margin-top:8px;padding-top:6px;border-top:1px solid var(--border);font-size:11px;color:var(--dim)">Refinamiento en ${learn.interactions_until_refine}/${learn.refine_interval} interacciones</div>`;
    }
    html += card('🎯', 'Observation Bias', biasHtml);

    html += card('👥', 'Usuarios', [
      metric('Usuarios reales', fmt(u.total), 'accent'),
      metric('Interacciones', fmt(u.interactions)),
      metric('Facts almacenados', fmt(u.facts)),
      metric('Core memory', fmt(u.core_memory)),
      metric('Equipos', fmt(u.teams)),
    ].join(''));

    html += card('⚙️', 'Sistema', [
      metric('Estado', op.status || '—', op.status === 'healthy' ? 'success' : 'warn', 'sys_status'),
      metric('Worker', op.worker_alive ? '✅ Activo' : '❌ Inactivo', op.worker_alive ? 'success' : 'danger', 'sys_worker'),
      metric('Heartbeat', fmt(op.worker_heartbeat_age, 0) + 's', '', 'sys_hb'),
      metric('Cola pendiente', fmt(op.queue_pending), '', 'sys_qp'),
      metric('Cola errores', fmt(op.queue_error), op.queue_error > 0 ? 'warn' : '', 'sys_qe'),
      metric('RAM', fmt(op.memory_mb) + ' MB', '', 'sys_ram'),
      metric('Latencia avg', fmt(op.avg_latency_s, 2) + 's', '', 'sys_lat'),
    ].join(''));

    html += card('📋', 'Operador', [
      metric('Ciclos convergencia', fmt(op.convergence_cycles)),
      metric('Tareas programadas', fmt(op.scheduled_tasks)),
      metric('Audit entries', fmt(op.audit_entries)),
      metric('Último audit', op.audit_latest || '—'),
      metric('Usuarios activos', fmt(op.active_users)),
    ].join(''));

    // === UNIVERSO ===
    html += sectionTitle('🌌 Universo — Dominios');

    const domains = g.domains || {};
    for (const [name, stats] of Object.entries(domains)) {
      const t7 = (g.trends_7d?.new_by_domain || {})[name] || 0;
      const t1 = (g.trends_24h?.new_by_domain || {})[name] || 0;
      html += card(domainDot(name), name.toUpperCase(), [
        metric('Estrellas', fmt(stats.count), 'accent'),
        metric('Hits totales', fmt(stats.total_hits)),
        metric('CC promedio', fmt(stats.avg_cc, 3)),
        metric('Frecuencia avg', fmt(stats.avg_freq, 3)),
        metric('Nuevas 24h', t1 > 0 ? '+' + t1 : '0', t1 > 0 ? 'success' : ''),
        metric('Nuevas 7d', t7 > 0 ? '+' + t7 : '0', t7 > 0 ? 'success' : ''),
        metric('Tiers', Object.entries(stats.tiers || {}).map(([t,c]) => `${t}=${c}`).join(' ') || '—'),
      ].join(''));
    }

    // === MERCADO (live cycle from /v1/market/live) ===
    html += sectionTitle('📈 Market — Ciclo en Vivo');
    html += '<div id="market-live"><div class="card"><div class="card-title">Cargando mercado...</div></div></div>';

    // === CONVERGENCIAS ===
    html += sectionTitle('🔗 Convergencias');

    html += card('🔗', 'Cross-Domain', [
      metric('Convergencias activas', fmt(c.cross_domain), 'accent'),
    ].join(''));

    const details = c.details || [];
    if (details.length) {
      let cRows = '';
      for (const cv of details) {
        cRows += `<tr>
          <td>${cv.intent || cv.a_intent || '—'}</td>
          <td>${cv.star_a}</td>
          <td>${cv.star_b}</td>
          <td>${fmt(cv.combined_cc, 3)}</td>
          <td>${fmt(cv.combined_hits)}</td>
          <td>${cv.type}</td>
        </tr>`;
      }
      html += `<div class="card" style="grid-column:1/-1"><div class="card-title"><span class="icon">⚡</span>Detalle Convergencias</div>
        <table><tr><th>Intent</th><th>Star A</th><th>Star B</th><th>CC</th><th>Hits</th><th>Tipo</th></tr>${cRows}</table></div>`;
    }

    const alerts = c.alert_history || [];
    if (alerts.length) {
      let aRows = '';
      for (const a of alerts) {
        aRows += `<tr><td>${(a.timestamp||'').slice(0,16)}</td><td>${a.intent||'—'}</td><td>${fmt(a.combined_hits)}</td><td>${fmt(a.combined_cc,3)}</td><td>${(a.reasons||[]).join(', ')}</td></tr>`;
      }
      html += `<div class="card" style="grid-column:1/-1"><div class="card-title"><span class="icon">🚨</span>Historial de Alertas</div>
        <table><tr><th>Fecha</th><th>Símbolo</th><th>Hits</th><th>CC</th><th>Razón</th></tr>${aRows}</table></div>`;
    }

    // === EVOLUCIÓN ===
    html += sectionTitle('📈 Evolución del Universo');

    const t7 = g.trends_7d || {};
    const t1 = g.trends_24h || {};
    html += card('📈', 'Tendencias', [
      metric('Nuevas 24h', fmt(t1.new), t1.new > 0 ? 'success' : ''),
      metric('Activas 24h', fmt(t1.active)),
      metric('Nuevas 7d', fmt(t7.new), t7.new > 0 ? 'success' : ''),
      metric('Activas 7d', fmt(t7.active)),
      metric('Creciendo (≥3 hits)', fmt(t7.growing), t7.growing > 0 ? 'accent' : ''),
    ].join(''));

    // Top stars
    const topStars = g.top_stars || [];
    if (topStars.length) {
      let tRows = '';
      for (const s of topStars.slice(0, 12)) {
        tRows += `<tr>
          <td>${domainDot(s.domain)}${s.id}</td>
          <td>${s.domain}</td>
          <td>${s.hits}</td>
          <td>${fmt(s.cc, 3)}</td>
          <td>${fmt(s.weight, 1)}</td>
          <td>${s.summary || '—'}</td>
        </tr>`;
      }
      html += `<div class="card" style="grid-column:1/-1"><div class="card-title"><span class="icon">🏆</span>Top Estrellas por Masa</div>
        <table><tr><th>ID</th><th>Dominio</th><th>Hits</th><th>CC</th><th>Peso</th><th>Resumen</th></tr>${tRows}</table></div>`;
    }

    grid.innerHTML = html;
  }

  // === MARKET LIVE RENDERER ===
  function ts2time(ts) {
    if (!ts) return '—';
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString('es', {hour:'2-digit', minute:'2-digit'});
  }

  // Retain last good market data to prevent flash on reload
  let _lastMarketData = null;

  async function loadMarket() {
    try {
      const res = await fetch('/v1/market/live');
      if (!res.ok) return;
      const d = await res.json();
      // Update cycle countdown from API timestamp
      if (d.ts) _lastCycleTs = d.ts;
      // Only update if we got actual data (symbols present)
      if (d.symbols && d.symbols.length > 0) {
        _lastMarketData = d;
      }
      renderMarket(_lastMarketData || d);
    } catch(e) {
      // On error, keep showing last good data
      if (_lastMarketData) renderMarket(_lastMarketData);
    }
  }

  function renderMarket(d) {
    const el = document.getElementById('market-live');
    if (!el) return;
    const syms = d.symbols || [];
    const sigs = d.signals || [];
    const pats = d.patterns || [];
    const props = d.proposals || [];
    const pos = d.positions || [];
    const learns = d.learning || [];
    const exec = d.executor || {};

    // Cycle flow bar
    const mode = exec.mode || 'off';
    const modeColors = {paper:'color:var(--warn)',live:'color:var(--danger)',off:'color:var(--dim)'};
    function step(name, on) { return `<span style="padding:2px 6px;border-radius:3px;font-size:11px;font-family:var(--mono);${on?'background:rgba(16,185,129,0.15);color:var(--success)':'color:var(--dim)'}">${name}</span>`; }
    let flow = '<div style="display:flex;align-items:center;justify-content:center;gap:3px;padding:8px 0;margin-bottom:10px;border-bottom:1px solid var(--border)">';
    flow += step('Observación', syms.some(s=>s.status==='activo'));
    flow += '<span style="color:var(--border)">→</span>';
    flow += step('Señales', sigs.length>0);
    flow += '<span style="color:var(--border)">→</span>';
    flow += step('Patrones', pats.length>0);
    flow += '<span style="color:var(--border)">→</span>';
    flow += step('Propuestas', props.length>0);
    flow += '<span style="color:var(--border)">→</span>';
    flow += step('Ejecución', pos.length>0||exec.paper_trades>0);
    flow += '<span style="color:var(--border)">→</span>';
    flow += step('Aprendizaje', learns.length>0||pats.length>0);
    flow += `<span style="margin-left:12px;padding:3px 8px;border-radius:4px;font-size:10px;font-family:var(--mono);border:1px solid var(--border);${modeColors[mode]||''}">${mode.toUpperCase()}</span>`;
    flow += '</div>';

    let html = flow;

    // Symbols with live prices
    let symHtml = '';
    for (const s of syms) {
      const dot = s.status==='activo'?'var(--success)':s.status==='error'||s.status==='no resuelto'?'var(--danger)':'var(--warn)';
      const price = s.price ? '$'+fmt(s.price,2) : '';
      symHtml += `<div style="display:flex;align-items:center;padding:4px 0;border-bottom:1px solid rgba(26,34,53,0.3);font-size:13px"><span style="width:6px;height:6px;border-radius:50%;background:${dot};margin-right:8px;flex-shrink:0;${s.status==='activo'?'box-shadow:0 0 6px '+dot:''}"></span><span style="font-weight:600;width:65px">${s.symbol}</span><span style="font-size:11px;color:var(--dim)">${s.status}</span><span style="margin-left:auto;font-family:var(--mono);color:var(--accent)">${price}</span></div>`;
    }
    html += card('🔭', 'Mercado', symHtml || '<div class="empty">Sin símbolos</div>');

    // Recent signals
    let sigHtml = '';
    for (const s of sigs.slice(0,6)) {
      const dirCls = s.direction==='buy'?'color:var(--success)':'color:var(--danger)';
      sigHtml += `<div style="display:flex;gap:8px;padding:5px 0;border-bottom:1px solid rgba(26,34,53,0.3);font-size:12px"><span style="font-family:var(--mono);color:var(--dim);min-width:42px">${ts2time(s.ts)}</span><span style="font-weight:700;color:var(--accent);min-width:45px">${s.symbol}</span><span style="font-size:10px;${dirCls};font-weight:600">${s.direction.toUpperCase()}</span><span style="font-family:var(--mono);color:var(--accent)">${s.conditions_met}/4</span><span style="color:var(--dim);flex:1">$${fmt(s.price,2)}</span></div>`;
    }
    html += card('⚡', `Señales<span class="count">${sigs.length}</span>`, sigHtml || '<div class="empty">Acumulando...</div>');

    // Patterns with progress bars
    const allPats = d.all_patterns || pats;
    let patHtml = '';
    for (const p of allPats.slice(0, 12)) {
      const wrCls = p.win_rate >= 55 ? 'color:var(--success)' : p.win_rate >= 40 ? 'color:var(--warn)' : 'color:var(--danger)';
      const barPct = p.progress || Math.min(Math.round(p.n_total / 15 * 100), 100);
      const barColor = p.usable ? 'var(--success)' : barPct >= 60 ? 'var(--warn)' : 'var(--accent)';
      const dirCls = p.direction === 'buy' ? 'color:var(--success)' : 'color:var(--danger)';
      patHtml += `<div style="padding:6px 0;border-bottom:1px solid rgba(26,34,53,0.3);font-size:12px">
        <div style="display:flex;gap:6px;align-items:center">
          <span style="${dirCls};font-weight:700;font-size:10px;width:32px">${p.direction.toUpperCase()}</span>
          <span style="font-weight:700;width:45px">${p.symbol}</span>
          <span style="font-family:var(--mono);font-size:11px;${wrCls}">${fmt(p.win_rate,0)}%</span>
          <span style="font-family:var(--mono);font-size:10px;color:var(--dim)">E:${fmt(p.expectancy,3)}%</span>
          ${p.usable ? '<span style="color:var(--success);font-size:10px;font-weight:700">✓ USABLE</span>' : ''}
          <span style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)">${p.n_total}/15</span>
        </div>
        <div style="margin-top:4px;height:4px;background:rgba(26,34,53,0.8);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${barPct}%;background:${barColor};border-radius:2px;transition:width 0.5s"></div>
        </div>
      </div>`;
    }
    html += card('🧠', `Patrones<span style="margin-left:6px;font-size:10px;color:var(--dim)">${allPats.length} total</span>`, patHtml || '<div class="empty">Necesita señales resueltas</div>');

    // Proposals
    let propHtml = '';
    for (const p of props.slice(0,3)) {
      const dirCls = p.direction==='buy'?'color:var(--success)':'color:var(--danger)';
      propHtml += `<div style="padding:6px 8px;margin-bottom:4px;border-radius:5px;background:rgba(79,143,247,0.06);border:1px solid rgba(79,143,247,0.15);font-size:12px"><div style="display:flex;gap:6px;font-weight:600"><span style="${dirCls}">${p.direction.toUpperCase()}</span> ${p.symbol} <span style="color:var(--dim)">@ $${fmt(p.entry_price,2)}</span></div><div style="color:var(--dim);font-size:11px;margin-top:3px">${p.reasoning}</div></div>`;
    }
    html += card('📋', `Propuestas<span class="count">${props.length}</span>`, propHtml || '<div class="empty">Esperando patrones usables</div>');

    // Positions
    let posHtml = '';
    for (const p of pos) {
      const pnlCls = p.pnl_pct>0?'color:var(--success)':p.pnl_pct<0?'color:var(--danger)':'';
      const posDirCls = p.direction==='buy'?'color:var(--success);font-weight:600':'color:var(--danger);font-weight:600';
      posHtml += `<div style="padding:6px 8px;margin-bottom:4px;border-radius:5px;border:1px solid var(--border);font-size:12px"><div style="display:flex;gap:6px;align-items:center"><span style="${posDirCls}">${p.direction.toUpperCase()}</span><span style="font-weight:700">${p.symbol}</span><span style="color:var(--dim)">$${fmt(p.amount_usd,0)}</span><span style="font-family:var(--mono);font-weight:700;margin-left:auto;${pnlCls}">${p.pnl_pct>0?'+':''}${fmt(p.pnl_pct,2)}%</span></div><div style="color:var(--dim);font-family:var(--mono);font-size:11px;margin-top:2px">$${fmt(p.entry_price,2)} → $${fmt(p.current_price,2)} · ${fmt(p.hours_open,1)}h</div></div>`;
    }
    html += card('📊', `Posiciones<span class="count">${pos.length}</span>`, posHtml || '<div class="empty">Sin posiciones</div>');

    // Learning
    let learnHtml = '';
    for (const l of learns) {
      const icon = l.result==='ganadora'?'✅':l.result==='perdedora'?'❌':'➖';
      learnHtml += `<div style="display:flex;gap:6px;padding:4px 0;border-bottom:1px solid rgba(26,34,53,0.3);font-size:12px">${icon} <span>${l.direction.toUpperCase()} ${l.symbol} — ${l.result}</span><span style="font-family:var(--mono);margin-left:auto;${l.pnl_usd>0?'color:var(--success)':'color:var(--danger)'}">$${fmt(l.pnl_usd,2)}</span></div>`;
    }
    learnHtml += `<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:11px;color:var(--dim)">Paper: ${exec.paper_trades||0}/${exec.min_paper_signals||30} · Wins: ${exec.paper_wins||0} · Pérdidas consec: ${exec.consecutive_losses||0} · Max: $${exec.max_position_usd||50}</div>`;
    html += card('🔄', 'Aprendizaje', learnHtml);

    // Notifications
    const notifs = d.notifications || [];
    if (notifs.length) {
      let notifHtml = '';
      for (const n of notifs.slice(0, 8)) {
        const icon = n.type === 'pattern_usable' ? '⚡' : '🔗';
        const ts = n.timestamp ? n.timestamp.slice(0, 16) : '';
        notifHtml += `<div style="display:flex;gap:6px;padding:4px 0;border-bottom:1px solid rgba(26,34,53,0.3);font-size:11px">
          <span>${icon}</span>
          <span style="color:var(--accent);font-weight:600;min-width:40px">${n.symbol}</span>
          <span style="color:var(--dim);flex:1">${n.detail}</span>
          <span style="color:var(--dim);font-family:var(--mono);font-size:10px">${ts}</span>
        </div>`;
      }
      html += card('🔔', `Notificaciones<span style="margin-left:6px;font-size:10px;color:var(--dim)">${notifs.length}</span>`, notifHtml);
    }

    // Smooth update: only replace if content changed (prevents flash)
    const newHtml = html;
    if (el._lastHtml !== newHtml) {
      el.innerHTML = newHtml;
      el._lastHtml = newHtml;
    }
  }

  load();
  loadMarket();
  setInterval(load, 15000);
  setInterval(loadMarket, 10000);
})();
</script>
</body>
</html>
