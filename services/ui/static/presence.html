<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vectrax — Presencia</title>
  <style>
    /* Fase 2: presencia viva. Sin cifras, etiquetas, tooltips ni leyenda (§2).
       UNA sola instancia del campo, centrada, sobre negro. Solo encuadre. */
    html, body {
      margin: 0; height: 100%; background: #000; overflow: hidden;
    }
    .stage {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    /* Una sola imagen: cuadrada al menor lado del viewport (vmin) para que quepa
       entera, centrada por flex, proporción preservada (object-fit: contain).
       Sin repeat, sin tile — es un <img> único, no un background. */
    img#field {
      width: 96vmin; height: 96vmin;
      object-fit: contain;
      display: block;
      image-rendering: auto;
      filter: saturate(1.05);
    }
    /* Fase 3 (voz+texto): el texto hablado aparece SINCRONIZADO con la voz. Es
       la conversación (§9), no una etiqueta de dashboard. */
    #speech {
      position: fixed; left: 0; right: 0; bottom: 7vmin;
      margin: 0 auto; max-width: 80vw; text-align: center;
      color: rgba(238,240,255,0.92);
      font: 300 clamp(16px, 3.1vmin, 30px)/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.01em; text-shadow: 0 1px 24px rgba(0,0,0,0.85);
      pointer-events: none; white-space: pre-wrap;
    }
    /* Señal mínima para ABRIR el canal (§2: sin etiquetas). Se desvanece al hablar. */
    #cue {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: rgba(200,210,235,0.28); font-size: 6vmin; cursor: pointer;
      transition: opacity 400ms ease; user-select: none;
    }
  </style>
</head>
<body>
  <div class="stage">
    <!-- Campo vivo (motor temporal, reloj del servidor). -->
    <img id="field" alt="" />
  </div>
  <!-- Voz+texto: la conversación (§9 Fase 3). El texto se revela sincronizado
       con la voz del cliente (Web Speech), nunca más de una palabra por delante. -->
  <div id="speech"></div>
  <!-- Señal para ABRIR el canal: el creador habla deliberadamente (y las
       políticas de autoplay exigen un gesto). -->
  <div id="cue">◦</div>
  <script>
  // --- Campo vivo: refresco a cadencia fija; el estado lo lleva el servidor ---
  (function () {
    var FPS = 12;
    var URL = '/v1/presence/field.png';
    var img = document.getElementById('field');
    function tick() {
      var probe = new Image();
      probe.onload = function () { img.src = probe.src; };
      probe.onerror = function () {};
      probe.src = URL + '?_=' + Date.now();
    }
    tick();
    setInterval(tick, Math.round(1000 / FPS));
  })();

  // --- Voz BIDIRECCIONAL: escuchar (Web Speech recognition) + responder -------
  // El creador ABRE el canal con un gesto (autoplay lo exige). Primer gesto: la
  // presencia se reporta a sí misma (phase0 → SELF_DETERMINISTIC, con procedencia).
  // Cada gesto siguiente ESCUCHA (push-to-talk): reconoce es-ES en el CLIENTE y
  // manda la transcripción al MISMO cerebro (/v1/presence/ask → ExternalGateway).
  // La presencia HABLA la respuesta (revelada palabra a palabra, nunca >1 por
  // delante) y marca el REGISTRO (source) del que vino. SÍNTESIS de SERVIDOR
  // (ElevenLabs, voz River, con timestamps de palabra); reconocimiento en cliente.
  // Si el servidor no da audio, cae a la voz del navegador (fallback).
  (function () {
    var speechEl = document.getElementById('speech');
    var cueEl = document.getElementById('cue');
    var busy = false;       // hablando
    var listening = false;  // escuchando
    var opened = false;     // canal ya abierto (primer gesto)
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    function revealTo(text, charIndex) {
      var end = text.indexOf(' ', charIndex);
      if (end < 0) end = text.length;
      return text.slice(0, end);
    }

    // Registro visual (forma): lo consumirá el campo. Aquí solo se marca; el
    // mapeo source → estado del campo (como la tensión) es el paso siguiente.
    function setRegister(source) {
      document.body.dataset.register = source || 'MODEL';
    }

    // Keepalive: Chrome corta la síntesis tras ~15s si no se le "resucita".
    var _ttsKeep = null;
    function _stopKeepalive() { if (_ttsKeep) { clearInterval(_ttsKeep); _ttsKeep = null; } }
    function _startKeepalive() {
      _stopKeepalive();
      _ttsKeep = setInterval(function () {
        if (!window.speechSynthesis.speaking) { _stopKeepalive(); return; }
        try { window.speechSynthesis.pause(); window.speechSynthesis.resume(); } catch (e) {}
      }, 10000);
    }

    // Habla un texto CONTINUO: parte en frases y las ENCOLA seguidas en el
    // sintetizador (el motor las reproduce back-to-back, sin esperar a que
    // termine cada una) → sin cortes entre frases. El revelado sigue palabra a
    // palabra con offsets ABSOLUTOS, nunca >1 palabra por delante de la voz.
    function speakText(fullText) {
      fullText = (fullText || '').trim();
      if (!fullText || !('speechSynthesis' in window)) { busy = false; return; }
      busy = true;
      cueEl.style.opacity = '0';
      speechEl.textContent = '';
      try { window.speechSynthesis.cancel(); } catch (e) {}
      _stopKeepalive();

      // Frases conservando el delimitador; fallback a todo el texto.
      var chunks = fullText.match(/[^.!?…]+[.!?…]*\s*/g) || [fullText];
      var offsets = [];
      var acc = 0;
      for (var i = 0; i < chunks.length; i++) { offsets.push(acc); acc += chunks[i].length; }
      var lastIdx = chunks.length - 1;

      chunks.forEach(function (chunk, idx) {
        var u = new SpeechSynthesisUtterance(chunk);
        u.lang = 'es-ES'; u.rate = 1.0; u.pitch = 1.0;
        u.onboundary = function (ev) {
          if (ev && ev.charIndex != null) {
            speechEl.textContent = revealTo(fullText, offsets[idx] + ev.charIndex);
          }
        };
        if (idx === lastIdx) {
          u.onend = function () { speechEl.textContent = fullText; busy = false; _stopKeepalive(); };
          u.onerror = function () { busy = false; _stopKeepalive(); };
        }
        window.speechSynthesis.speak(u);  // encolar sin esperar → continuo
      });
      _startKeepalive();
    }

    // --- Síntesis de SERVIDOR (ElevenLabs, voz River) + revelado por timestamps ---
    // Reproduce el audio del servidor y revela el texto palabra a palabra guiado
    // por los TIMESTAMPS de palabra de ElevenLabs (NO por onboundary). Aquí se
    // engancharán después los pulsos de la presencia (§Vibración), uno por palabra.
    function playServerAudio(text, b64, words) {
      words = words || [];
      var audio = new Audio('data:audio/mpeg;base64,' + b64);
      var raf = null;
      cueEl.style.opacity = '0';
      function tick() {
        var t = audio.currentTime;
        var k = 0;
        while (k < words.length && words[k].start <= t) k++;
        // Revelado: solo palabras ya iniciadas (nunca >1 por delante de la voz).
        speechEl.textContent = words.slice(0, k).map(function (w) { return w.word; }).join(' ');
        if (!audio.ended) raf = requestAnimationFrame(tick);
      }
      audio.onplay = function () { if (raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); };
      audio.onended = function () { if (raf) cancelAnimationFrame(raf); speechEl.textContent = text; busy = false; };
      audio.onerror = function () { if (raf) cancelAnimationFrame(raf); speakText(text); };  // fallback navegador
      audio.play().catch(function () { speakText(text); });   // autoplay bloqueado → fallback
    }

    // Punto ÚNICO de "hablar": intenta la voz del canal en el SERVIDOR (River vía
    // ElevenLabs, con timestamps). Si no hay audio (fallo/clave/permiso), cae a la
    // voz del navegador (speakText). El texto se revela sincronizado en ambos casos.
    function speak(text) {
      text = (text || '').trim();
      if (!text) { busy = false; return; }
      busy = true;
      cueEl.style.opacity = '0';
      speechEl.textContent = '…';
      fetch('/v1/presence/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text }),
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.audio_base64) playServerAudio(text, d.audio_base64, d.words || []);
          else speakText(text);   // servidor sin audio → fallback navegador
        })
        .catch(function () { speakText(text); });
    }

    // phase0: la presencia se reporta a sí misma (SELF_DETERMINISTIC + procedencia).
    function selfReport() {
      busy = true;
      fetch('/v1/presence/utterance')
        .then(function (r) { return r.json(); })
        .then(function (u) {
          setRegister((u && u.source) || 'SELF_DETERMINISTIC');
          speak(u && u.text ? String(u.text) : '');
        })
        .catch(function () { busy = false; });
    }

    // Manda la transcripción al MISMO cerebro y habla la respuesta + su registro.
    function ask(text) {
      text = (text || '').trim();
      if (!text) { busy = false; return; }
      busy = true;
      speechEl.textContent = '…';
      fetch('/v1/presence/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text }),
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          setRegister(d && d.source);
          speak(d && d.answer ? String(d.answer) : '');
        })
        .catch(function () { busy = false; });
    }

    // Escucha UNA frase (push-to-talk). Reconocimiento en el CLIENTE (es-ES).
    function listen() {
      if (busy || listening) return;
      if (!SR) { selfReport(); return; }   // sin reconocimiento: cae a phase0
      var rec = new SR();
      rec.lang = 'es-ES';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      rec.continuous = false;
      listening = true;
      cueEl.textContent = '●';             // señal mínima de escucha (§2: sin etiquetas)
      rec.onresult = function (e) {
        var t = '';
        try { t = e.results[0][0].transcript; } catch (err) {}
        ask(t);
      };
      rec.onerror = function () {};
      rec.onend = function () { listening = false; cueEl.textContent = '◦'; };
      try { rec.start(); } catch (err) { listening = false; cueEl.textContent = '◦'; }
    }

    // Primer gesto: abre el canal con el auto-reporte (SELF_DETERMINISTIC).
    // Gestos siguientes: escuchar (hablarle).
    function gesture() {
      if (busy) return;
      if (!opened) { opened = true; selfReport(); return; }
      listen();
    }

    document.addEventListener('click', gesture);
    document.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); gesture(); }
    });
  })();
  </script>
</body>
</html>
