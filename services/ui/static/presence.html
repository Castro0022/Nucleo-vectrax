<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vectrax — Presencia</title>
  <style>
    /* Fase 2: presencia viva. Sin cifras, etiquetas, tooltips ni leyenda (§2).
       UNA sola instancia del campo, centrada, sobre negro. Solo encuadre. */
    html, body {
      margin: 0; height: 100%; background: #000; overflow: hidden;
    }
    .stage {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
      /* Fase 3: transición universo↔canal (<1s, interrumpible). Al togglear
         .closed el navegador interpola desde el valor ACTUAL → si se invierte a
         mitad, no hay salto. */
      transition: opacity 700ms ease, transform 700ms cubic-bezier(.22,.61,.36,1);
      will-change: opacity, transform;
    }
    /* Canal cerrado (visto desde el universo): lejano y tenue. */
    .stage.closed { opacity: 0; transform: scale(0.82); }
    /* Una sola imagen: cuadrada al menor lado del viewport (vmin) para que quepa
       entera, centrada por flex, proporción preservada (object-fit: contain).
       Sin repeat, sin tile — es un <img> único, no un background. */
    img#field {
      width: 96vmin; height: 96vmin;
      object-fit: contain;
      display: block;
      image-rendering: auto;
      filter: saturate(1.05);
    }
    /* Fase 3 (voz+texto): el texto hablado aparece SINCRONIZADO con la voz. Es
       la conversación (§9), no una etiqueta de dashboard. */
    #speech {
      position: fixed; left: 0; right: 0; bottom: 7vmin;
      margin: 0 auto; max-width: 80vw; text-align: center;
      color: rgba(238,240,255,0.92);
      font: 300 clamp(16px, 3.1vmin, 30px)/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.01em; text-shadow: 0 1px 24px rgba(0,0,0,0.85);
      pointer-events: none; white-space: pre-wrap;
    }
    /* Señal mínima para ABRIR el canal (§2: sin etiquetas). Se desvanece al hablar. */
    #cue {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: rgba(200,210,235,0.28); font-size: 6vmin; cursor: pointer;
      transition: opacity 400ms ease; user-select: none;
    }
    /* Palabra de activación (§2 sin texto): el estado se ve en la FORMA.
       "escuchando" = brillo tenue y sostenido; "activado" = destello breve
       (además del pulso REAL en el RD del servidor). */
    .stage.listening img#field { filter: saturate(1.08) drop-shadow(0 0 16px rgba(120,150,255,0.10)); }
    .stage.activated img#field { animation: vx-activated 640ms ease-out; }
    @keyframes vx-activated {
      0%   { filter: saturate(1.5) brightness(1.18) drop-shadow(0 0 26px rgba(150,180,255,0.30)); }
      100% { filter: saturate(1.05); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <!-- Campo vivo (motor temporal, reloj del servidor). -->
    <img id="field" alt="" />
  </div>
  <!-- Voz+texto: la conversación (§9 Fase 3). El texto se revela sincronizado
       con la voz del cliente (Web Speech), nunca más de una palabra por delante. -->
  <div id="speech"></div>
  <!-- Señal para ABRIR el canal: el creador habla deliberadamente (y las
       políticas de autoplay exigen un gesto). -->
  <div id="cue">◦</div>
  <script>
  // --- Campo vivo: refresco a cadencia fija; el estado lo lleva el servidor ---
  (function () {
    var FPS = 12;
    var URL = '/v1/presence/field.png';
    var img = document.getElementById('field');
    function tick() {
      var probe = new Image();
      probe.onload = function () { img.src = probe.src; };
      probe.onerror = function () {};
      probe.src = URL + '?_=' + Date.now();
    }
    tick();
    setInterval(tick, Math.round(1000 / FPS));
  })();

  // --- Voz BIDIRECCIONAL: escuchar (Web Speech recognition) + responder -------
  // El creador ABRE el canal con un gesto (autoplay lo exige). Primer gesto: la
  // presencia se reporta a sí misma (phase0 → SELF_DETERMINISTIC, con procedencia).
  // Cada gesto siguiente ESCUCHA (push-to-talk): reconoce es-ES en el CLIENTE y
  // manda la transcripción al MISMO cerebro (/v1/presence/ask → ExternalGateway).
  // La presencia HABLA la respuesta (revelada palabra a palabra, nunca >1 por
  // delante) y marca el REGISTRO (source) del que vino. SÍNTESIS de SERVIDOR
  // (ElevenLabs, voz River, con timestamps de palabra); reconocimiento en cliente.
  // Si el servidor no da audio, cae a la voz del navegador (fallback).
  (function () {
    var speechEl = document.getElementById('speech');
    var cueEl = document.getElementById('cue');
    var busy = false;       // hablando
    var listening = false;  // escuchando
    var opened = false;     // canal ya abierto (primer gesto)
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    var _geo = null;        // ubicación del navegador (para place_search "cerca")

    function revealTo(text, charIndex) {
      var end = text.indexOf(' ', charIndex);
      if (end < 0) end = text.length;
      return text.slice(0, end);
    }

    // Registro visual (FORMA): informa al SERVIDOR la fuente de la locución para
    // que el campo se tiña distinto por registro (SELF_DETERMINISTIC/MEMORY/
    // ONLINE/MODEL), sin texto ni etiqueta. También lo marca en el cliente.
    function setRegister(source) {
      source = source || 'MODEL';
      document.body.dataset.register = source;
      try {
        fetch('/v1/presence/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ source: source }),
        }).catch(function () {});
      } catch (e) {}
    }

    // Pulso de voz: cada palabra hablada deposita sustancia en el RD del servidor
    // (§Vibración = evento REAL; sin habla no hay pulso). Fire-and-forget.
    function firePulse() {
      try {
        fetch('/v1/presence/pulse', { method: 'POST', keepalive: true }).catch(function () {});
      } catch (e) {}
    }

    // Keepalive: Chrome corta la síntesis tras ~15s si no se le "resucita".
    var _ttsKeep = null;
    function _stopKeepalive() { if (_ttsKeep) { clearInterval(_ttsKeep); _ttsKeep = null; } }
    function _startKeepalive() {
      _stopKeepalive();
      _ttsKeep = setInterval(function () {
        if (!window.speechSynthesis.speaking) { _stopKeepalive(); return; }
        try { window.speechSynthesis.pause(); window.speechSynthesis.resume(); } catch (e) {}
      }, 10000);
    }

    // Habla un texto CONTINUO: parte en frases y las ENCOLA seguidas en el
    // sintetizador (el motor las reproduce back-to-back, sin esperar a que
    // termine cada una) → sin cortes entre frases. El revelado sigue palabra a
    // palabra con offsets ABSOLUTOS, nunca >1 palabra por delante de la voz.
    function speakText(fullText) {
      fullText = (fullText || '').trim();
      if (!fullText || !('speechSynthesis' in window)) { busy = false; return; }
      busy = true;
      cueEl.style.opacity = '0';
      speechEl.textContent = '';
      try { window.speechSynthesis.cancel(); } catch (e) {}
      _stopKeepalive();

      // Frases conservando el delimitador; fallback a todo el texto.
      var chunks = fullText.match(/[^.!?…]+[.!?…]*\s*/g) || [fullText];
      var offsets = [];
      var acc = 0;
      for (var i = 0; i < chunks.length; i++) { offsets.push(acc); acc += chunks[i].length; }
      var lastIdx = chunks.length - 1;

      chunks.forEach(function (chunk, idx) {
        var u = new SpeechSynthesisUtterance(chunk);
        u.lang = 'es-ES'; u.rate = 1.0; u.pitch = 1.0;
        u.onboundary = function (ev) {
          if (ev && ev.charIndex != null) {
            speechEl.textContent = revealTo(fullText, offsets[idx] + ev.charIndex);
            firePulse();  // fallback navegador: pulso por límite de palabra
          }
        };
        if (idx === lastIdx) {
          u.onend = function () { speechEl.textContent = fullText; busy = false; _stopKeepalive(); };
          u.onerror = function () { busy = false; _stopKeepalive(); };
        }
        window.speechSynthesis.speak(u);  // encolar sin esperar → continuo
      });
      _startKeepalive();
    }

    // --- Síntesis de SERVIDOR (ElevenLabs, voz River) + revelado + pulsos --------
    // Reproduce el audio del servidor y revela el texto palabra a palabra guiado
    // por los TIMESTAMPS de palabra de ElevenLabs (NO por onboundary). Cada palabra
    // recién iniciada dispara un PULSO en el RD (§Vibración), uno por palabra.
    function playServerAudio(text, b64, words) {
      words = words || [];
      var audio = new Audio('data:audio/mpeg;base64,' + b64);
      var raf = null;
      var _lastK = 0;
      cueEl.style.opacity = '0';
      function tick() {
        var t = audio.currentTime;
        var k = 0;
        while (k < words.length && words[k].start <= t) k++;
        // Revelado: solo palabras ya iniciadas (nunca >1 por delante de la voz).
        speechEl.textContent = words.slice(0, k).map(function (w) { return w.word; }).join(' ');
        // Pulso por PALABRA: cada palabra recién iniciada deposita un pulso en el
        // RD (§Vibración = evento real). Uno por palabra nueva.
        while (_lastK < k) { firePulse(); _lastK++; }
        if (!audio.ended) raf = requestAnimationFrame(tick);
      }
      audio.onplay = function () { if (raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); };
      audio.onended = function () { if (raf) cancelAnimationFrame(raf); speechEl.textContent = text; busy = false; };
      audio.onerror = function () { if (raf) cancelAnimationFrame(raf); speakText(text); };  // fallback navegador
      audio.play().catch(function () { speakText(text); });   // autoplay bloqueado → fallback
    }

    // Punto ÚNICO de "hablar": intenta la voz del canal en el SERVIDOR (River vía
    // ElevenLabs, con timestamps). Si no hay audio (fallo/clave/permiso), cae a la
    // voz del navegador (speakText). El texto se revela sincronizado en ambos casos.
    function speak(text) {
      text = (text || '').trim();
      if (!text) { busy = false; return; }
      busy = true;
      cueEl.style.opacity = '0';
      speechEl.textContent = '…';
      fetch('/v1/presence/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text }),
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.audio_base64) playServerAudio(text, d.audio_base64, d.words || []);
          else speakText(text);   // servidor sin audio → fallback navegador
        })
        .catch(function () { speakText(text); });
    }

    // phase0: la presencia se reporta a sí misma (SELF_DETERMINISTIC + procedencia).
    function selfReport() {
      busy = true;
      fetch('/v1/presence/utterance')
        .then(function (r) { return r.json(); })
        .then(function (u) {
          setRegister((u && u.source) || 'SELF_DETERMINISTIC');
          speak(u && u.text ? String(u.text) : '');
        })
        .catch(function () { busy = false; });
    }

    // Manda la transcripción al MISMO cerebro y habla la respuesta + su registro.
    function ask(text) {
      text = (text || '').trim();
      if (!text) { busy = false; return; }
      busy = true;
      speechEl.textContent = '…';
      fetch('/v1/presence/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(_geo ? { text: text, lat: _geo.lat, lng: _geo.lng } : { text: text }),
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          setRegister(d && d.source);
          speak(d && d.answer ? String(d.answer) : '');
        })
        .catch(function () { busy = false; });
    }

    // --- Palabra de activación "VECTRAX": escucha CONTINUA + auto-reinicio -------
    // Chrome corta el reconocimiento por silencio (~seg) y por tope de sesión
    // (~60s) AUN con continuous=true. Lo tratamos como EFÍMERO: un bucle que
    // reinicia en onend/onerror mientras wantListening. Solo se envía al cerebro
    // lo que va TRAS "VECTRAX"; lo anterior (o sin la palabra) se descarta en el
    // cliente y no sale a ningún sitio.
    var stageEl = document.querySelector('.stage');
    var rec = null;
    var wantListening = false;   // queremos escuchar en bucle
    var running = false;         // recognizer activo ahora mismo
    var armed = false;           // "VECTRAX" oído solo → esperar el comando siguiente
    var armTimer = null;
    var flashArmedOnce = false;  // evita repetir el destello dentro de una activación
    var lastStart = 0;
    var WAKE = /v[eé]ctra?x/i;    // tolera "vectrax"/"vectra"/"véctrax" (mishears del ASR)

    function setListening(on) { if (stageEl) stageEl.classList.toggle('listening', !!on); }

    // "Activado": destello en la FORMA + pulso REAL en el RD (la palabra ES habla
    // real → pulso legítimo). Sin texto.
    function flashActivated() {
      if (stageEl) {
        stageEl.classList.remove('activated');
        void stageEl.offsetWidth;                 // reinicia la animación
        stageEl.classList.add('activated');
        setTimeout(function () { if (stageEl) stageEl.classList.remove('activated'); }, 660);
      }
      firePulse();
    }

    function disarm() { armed = false; if (armTimer) { clearTimeout(armTimer); armTimer = null; } }

    function dispatchCommand(cmd) {
      cmd = (cmd || '').trim();
      disarm();
      if (!cmd) return;
      cueEl.style.opacity = '0';
      ask(cmd);                                   // → /v1/presence/ask (con geoloc)
    }

    // Procesa transcripciones. Solo actúa TRAS "VECTRAX"; lo previo se descarta.
    function onRecResult(e) {
      if (busy) return;                           // hablando: ignora (evita eco de su voz)
      var finalTxt = '', interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var r = e.results[i];
        if (r.isFinal) finalTxt += r[0].transcript; else interim += r[0].transcript;
      }
      // Destello "activado" en cuanto asoma la palabra (interim = más ágil), 1 vez.
      if (!armed && !flashArmedOnce && WAKE.test((finalTxt || interim).toLowerCase())) {
        flashArmedOnce = true; flashActivated();
      }
      if (!finalTxt) return;                       // interim: esperar el resultado final
      var low = finalTxt.toLowerCase();
      var mm = low.match(WAKE);
      if (mm) {
        if (!flashArmedOnce) flashActivated();
        flashArmedOnce = false;                    // reset para la próxima activación
        var after = finalTxt.slice(mm.index + mm[0].length).replace(/^[\s,.:;–—-]+/, '').trim();
        if (after) { dispatchCommand(after); }     // "VECTRAX <comando>" en un turno
        else { armed = true; if (armTimer) clearTimeout(armTimer); armTimer = setTimeout(disarm, 8000); }
        return;
      }
      flashArmedOnce = false;
      if (armed) { dispatchCommand(finalTxt); return; }  // "VECTRAX" fue en el turno previo
      // sin la palabra y sin armar → descartar (NO se envía)
    }

    function startRec() {
      if (!SR || running || !wantListening) return;
      var now = Date.now();
      if (now - lastStart < 250) { setTimeout(startRec, 300); return; }  // backoff anti crash-loop
      lastStart = now;
      try { rec = new SR(); } catch (err) { return; }
      rec.lang = 'es-ES';
      rec.continuous = true;
      rec.interimResults = true;
      rec.maxAlternatives = 1;
      rec.onstart = function () { running = true; setListening(true); };
      rec.onresult = onRecResult;
      rec.onerror = function (ev) {
        // permiso denegado → parar de verdad (no se recupera sin gesto del usuario).
        if (ev && (ev.error === 'not-allowed' || ev.error === 'service-not-allowed')) {
          wantListening = false; setListening(false);
        }
        // no-speech / aborted / network → onend reiniciará.
      };
      rec.onend = function () {
        running = false;
        if (wantListening) startRec();             // Chrome cortó → reiniciar en bucle
        else setListening(false);
      };
      try { rec.start(); }
      catch (err) { running = false; setTimeout(startRec, 300); }  // InvalidStateError → reintento
    }

    function startListeningLoop() {
      if (!SR) { selfReport(); return; }           // sin reconocimiento: al menos auto-reporte
      wantListening = true;
      startRec();
    }

    // Geoloc: se pide tras el gesto (contexto seguro; localhost vale). Se manda en
    // /v1/presence/ask para que place_search haga la búsqueda "cerca".
    function captureGeo() {
      if (!navigator.geolocation) return;
      try {
        navigator.geolocation.getCurrentPosition(
          function (p) { _geo = { lat: p.coords.latitude, lng: p.coords.longitude }; },
          function () {},
          { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 }
        );
      } catch (e) {}
    }

    // UN único gesto inicial: los navegadores EXIGEN gesto para micro + audio.
    // A partir de ahí: escucha continua por palabra de activación, sin más teclas.
    function gesture() {
      if (opened) return;
      opened = true;
      cueEl.style.opacity = '0';
      captureGeo();
      startListeningLoop();
      selfReport();                                // abre el canal (auto-reporte + audio)
    }

    document.addEventListener('click', gesture);
    document.addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); gesture(); }
    });
  })();

  // --- Transición universo↔canal (<1s, interrumpible) ------------------------
  // Entrar al canal lo abre desde un estado "lejano" (como visto desde el
  // universo) en <1s. Salir (Esc) cierra en <1s y vuelve a /universe; si se
  // reabre a mitad (cualquier interacción), se cancela la salida y reabre desde
  // el punto actual — sin salto (lo interpola el navegador).
  (function () {
    var TRANS_MS = 700;
    var stage = document.querySelector('.stage');
    if (!stage) return;
    var navTimer = null;

    // Entrada: arranca cerrado y abre en el siguiente frame.
    stage.classList.add('closed');
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { stage.classList.remove('closed'); });
    });

    function closeToUniverse() {
      if (navTimer) return;               // ya cerrando
      stage.classList.add('closed');
      navTimer = setTimeout(function () { window.location.href = '/universe'; }, TRANS_MS);
    }
    function cancelClose() {
      if (!navTimer) return;
      clearTimeout(navTimer); navTimer = null;
      stage.classList.remove('closed');   // reabre desde el punto actual (interrumpible)
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeToUniverse(); return; }
      cancelClose();
    }, true);
    document.addEventListener('click', cancelClose, true);  // clic cancela cierre en curso
  })();
  </script>
</body>
</html>
