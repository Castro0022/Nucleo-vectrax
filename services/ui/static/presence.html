<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vectrax — Presencia</title>
  <style>
    /* Fase 2: presencia viva. Sin cifras, etiquetas, tooltips ni leyenda (§2).
       UNA sola instancia del campo, centrada, sobre negro. Solo encuadre. */
    html, body {
      margin: 0; height: 100%; background: #000; overflow: hidden;
    }
    .stage {
      position: fixed; inset: 0; background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    /* Una sola imagen: cuadrada al menor lado del viewport (vmin) para que quepa
       entera, centrada por flex, proporción preservada (object-fit: contain).
       Sin repeat, sin tile — es un <img> único, no un background. */
    img#field {
      width: 96vmin; height: 96vmin;
      object-fit: contain;
      display: block;
      image-rendering: auto;
      filter: saturate(1.05);
    }
  </style>
</head>
<body>
  <div class="stage">
    <!-- Campo vivo renderizado server-side. El ESTADO (t, tensión) lo decide el
         SERVIDOR por su reloj: todas las pestañas ven el mismo instante. -->
    <img id="field" alt="" />
  </div>
  <script>
  // Una sola instancia. La cadencia (refresco) vive en el cliente; el ESTADO
  // (t, tensión) viene del servidor por su reloj — no pasamos ?t=. Precargamos
  // cada frame en un Image() y solo entonces cambiamos el src visible → sin
  // parpadeo y sin mostrar imágenes a medio cargar. Nunca 500.
  (function () {
    var FPS = 12;                      // debe seguir la cadencia del servidor
    var URL = '/v1/presence/field.png';
    var img = document.getElementById('field');
    function tick() {
      var probe = new Image();
      probe.onload = function () { img.src = probe.src; };
      probe.onerror = function () { /* reintenta en el siguiente tick */ };
      probe.src = URL + '?_=' + Date.now();  // cache-bust; el server usa su reloj
    }
    tick();
    setInterval(tick, Math.round(1000 / FPS));
  })();
  </script>
</body>
</html>
