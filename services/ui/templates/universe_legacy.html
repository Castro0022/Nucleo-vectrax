<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vectrax — Universo Cognitivo (legacy)</title>
<style>
:root {
  --bg: #060a10; --surface: #0e1420; --border: #1a2235;
  --text: #d1d5db; --dim: #5a6374; --accent: #4f8ff7;
  --core: #fbbf24; --mid: #4f8ff7; --outer: #3a4560;
  --convergence: #a78bfa; --collective: #06d6a0;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'SF Mono', Menlo, Consolas, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); }

/* Canvas fills viewport */
#universe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: grab; }
#universe.dragging { cursor: grabbing; }

/* HUD overlay */
.hud { position: absolute; pointer-events: none; z-index: 10; }
.hud-interactive { pointer-events: auto; }

/* Top bar */
#hud-top {
  top: 0; left: 0; right: 0; display: flex; align-items: center;
  padding: 14px 20px; gap: 16px;
  background: linear-gradient(180deg, rgba(6,10,16,0.95) 0%, transparent 100%);
}
#hud-top .logo { font-size: 18px; font-weight: 800; color: var(--accent); letter-spacing: 0.04em; }
#hud-top .stats { font-size: 12px; color: var(--dim); font-family: var(--mono); }
#hud-top .stats b { color: var(--text); }

/* Controls panel */
#hud-controls {
  top: 60px; right: 16px; width: 200px;
  background: rgba(14,20,32,0.92); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; font-size: 12px;
}
#hud-controls label { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; color: var(--dim); cursor: pointer; }
#hud-controls input[type=checkbox] { accent-color: var(--accent); }
#hud-controls .sep { height: 1px; background: var(--border); margin: 8px 0; }
#hud-controls .filter-title { font-weight: 600; color: var(--text); margin-bottom: 6px; }

/* Legend */
#hud-legend {
  bottom: 16px; left: 16px;
  background: rgba(14,20,32,0.92); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 16px; font-size: 11px;
}
.legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.legend-ring { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 2px solid; background: transparent; }

/* Tooltip */
#tooltip {
  position: absolute; display: none; z-index: 20; pointer-events: none;
  background: rgba(14,20,32,0.96); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px; max-width: 300px;
  font-size: 12px; line-height: 1.5; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
#tooltip .tt-label { font-weight: 700; color: #fff; margin-bottom: 4px; word-break: break-word; }
#tooltip .tt-meta { color: var(--dim); font-family: var(--mono); font-size: 11px; }
#tooltip .tt-meta b { color: var(--text); }

/* Back link */
#hud-back {
  top: 16px; right: 230px;
  font-size: 12px; color: var(--dim); text-decoration: none;
  background: rgba(14,20,32,0.8); padding: 6px 14px; border-radius: 6px;
  border: 1px solid var(--border);
}
#hud-back:hover { color: var(--text); }

/* Empty state */
#empty-state {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center; z-index: 5; display: none;
}
#empty-state .es-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.3; }
#empty-state .es-text { font-size: 16px; color: var(--dim); }
#empty-state .es-sub { font-size: 13px; color: var(--dim); margin-top: 8px; opacity: 0.6; }
</style>
</head>
<body>

<canvas id="universe"></canvas>

<!-- Empty state -->
<div id="empty-state">
  <div class="es-icon">✦</div>
  <div class="es-text">El universo está vacío</div>
  <div class="es-sub">Ingesta conocimiento para ver estrellas aparecer</div>
</div>

<!-- HUD: Top bar -->
<div id="hud-top" class="hud">
  <span class="logo">✦ VECTRAX UNIVERSE</span>
  <span class="stats" id="stats-text"></span>
</div>

<!-- HUD: Back -->
<a id="hud-back" href="/" class="hud hud-interactive">← Vectrax</a>

<!-- HUD: Controls -->
<div id="hud-controls" class="hud hud-interactive">
  <div class="filter-title">Capas</div>
  <label><input type="checkbox" data-filter="layer-core" checked> <span style="color:var(--core)">●</span> Core</label>
  <label><input type="checkbox" data-filter="layer-mid" checked> <span style="color:var(--mid)">●</span> Mid</label>
  <label><input type="checkbox" data-filter="layer-outer" checked> <span style="color:var(--outer)">●</span> Outer</label>
  <div class="sep"></div>
  <div class="filter-title">Tipos</div>
  <label><input type="checkbox" data-filter="type-primary" checked> Primarias</label>
  <label><input type="checkbox" data-filter="type-convergence" checked> Convergencia</label>
  <label><input type="checkbox" data-filter="type-collective" checked> Colectivas</label>
  <div class="sep"></div>
  <div class="filter-title">Vista</div>
  <label><input type="checkbox" data-filter="show-edges" checked> Conexiones</label>
  <label><input type="checkbox" data-filter="show-constellations" checked> Constelaciones</label>
  <label><input type="checkbox" data-filter="show-labels" checked> Etiquetas</label>
  <label><input type="checkbox" data-filter="show-orbits"> Órbitas</label>
</div>

<!-- HUD: Legend -->
<div id="hud-legend" class="hud">
  <div class="legend-row"><div class="legend-dot" style="background:var(--core)"></div> Core (alta gravedad)</div>
  <div class="legend-row"><div class="legend-dot" style="background:var(--mid)"></div> Mid (emergente)</div>
  <div class="legend-row"><div class="legend-dot" style="background:var(--outer)"></div> Outer (periferia)</div>
  <div class="legend-row"><div class="legend-ring" style="border-color:var(--convergence)"></div> Convergencia</div>
  <div class="legend-row"><div class="legend-ring" style="border-color:var(--collective)"></div> Colectiva</div>
  <div class="legend-row" style="margin-top:4px;opacity:0.6">Tamaño = masa gravitacional</div>
</div>

<!-- Tooltip -->
<div id="tooltip">
  <div class="tt-label" id="tt-label"></div>
  <div class="tt-meta" id="tt-meta"></div>
</div>

<script>
/* ================================================================
   Vectrax Universe — Interactive Canvas Visualizer
   ================================================================ */
(function() {
  'use strict';

  const canvas = document.getElementById('universe');
  const ctx = canvas.getContext('2d');
  const tooltip = document.getElementById('tooltip');
  const statsEl = document.getElementById('stats-text');
  const emptyEl = document.getElementById('empty-state');

  // --- State ---
  let W = 0, H = 0;
  let stars = [], edges = [], constellations = [];
  let starMap = {};       // id → star object with computed x,y
  let cam = { x: 0, y: 0, zoom: 1 };
  let drag = { active: false, sx: 0, sy: 0, cx: 0, cy: 0 };
  let hovered = null;
  let animFrame = 0;
  let filters = {
    'layer-core': true, 'layer-mid': true, 'layer-outer': true,
    'type-primary': true, 'type-convergence': true, 'type-collective': true,
    'show-edges': true, 'show-constellations': true, 'show-labels': true,
    'show-orbits': false,
  };

  // --- Colors ---
  const LAYER_COLORS = { core: '#fbbf24', mid: '#4f8ff7', outer: '#3a4560' };
  const TYPE_COLORS = { convergence: '#a78bfa', collective: '#06d6a0' };
  const CONSTELLATION_COLORS = [
    'rgba(79,143,247,0.08)', 'rgba(167,139,250,0.08)', 'rgba(6,214,160,0.08)',
    'rgba(251,191,36,0.08)', 'rgba(248,113,113,0.08)', 'rgba(6,182,212,0.08)',
  ];
  const CONSTELLATION_STROKES = [
    'rgba(79,143,247,0.25)', 'rgba(167,139,250,0.25)', 'rgba(6,214,160,0.25)',
    'rgba(251,191,36,0.25)', 'rgba(248,113,113,0.25)', 'rgba(6,182,212,0.25)',
  ];

  // --- Resize ---
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Hash for deterministic angle ---
  function hashStr(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) {
      h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    }
    return h;
  }

  // --- Position stars radially ---
  function layoutStars() {
    const cx = 0, cy = 0;
    const maxR = Math.min(W, H) * 0.42;
    starMap = {};
    for (const s of stars) {
      const angle = (hashStr(s.id) % 36000) / 36000 * Math.PI * 2;
      const r = s.distance_to_core * maxR;
      s._x = cx + Math.cos(angle) * r;
      s._y = cy + Math.sin(angle) * r;
      s._r = 3 + s.mass * 17;       // radius: 3–20px
      s._visible = true;
      starMap[s.id] = s;
    }
  }

  // --- Filter visibility ---
  function applyFilters() {
    for (const s of stars) {
      let vis = true;
      if (s.layer === 'core' && !filters['layer-core']) vis = false;
      if (s.layer === 'mid' && !filters['layer-mid']) vis = false;
      if (s.layer === 'outer' && !filters['layer-outer']) vis = false;
      const isCollective = s.owner === '__collective__';
      if (s.star_type === 'primary' && !filters['type-primary']) vis = false;
      if (s.star_type === 'convergence' && !isCollective && !filters['type-convergence']) vis = false;
      if (isCollective && !filters['type-collective']) vis = false;
      s._visible = vis;
    }
  }

  // --- Convex hull (Graham scan) ---
  function convexHull(points) {
    if (points.length < 3) return points;
    const pts = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (O, A, B) => (A[0]-O[0])*(B[1]-O[1]) - (A[1]-O[1])*(B[0]-O[0]);
    const lower = [];
    for (const p of pts) { while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0) lower.pop(); lower.push(p); }
    const upper = [];
    for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0) upper.pop(); upper.push(p); }
    upper.pop(); lower.pop();
    return lower.concat(upper);
  }

  // --- Camera transforms ---
  function toScreen(wx, wy) {
    return [(wx - cam.x) * cam.zoom + W / 2, (wy - cam.y) * cam.zoom + H / 2];
  }
  function toWorld(sx, sy) {
    return [(sx - W / 2) / cam.zoom + cam.x, (sy - H / 2) / cam.zoom + cam.y];
  }

  // --- Starfield background ---
  let bgStars = [];
  function initBgStars() {
    bgStars = [];
    for (let i = 0; i < 300; i++) {
      bgStars.push({
        x: Math.random() * 4000 - 2000,
        y: Math.random() * 4000 - 2000,
        r: Math.random() * 1.2 + 0.3,
        a: Math.random() * 0.4 + 0.1,
      });
    }
  }
  initBgStars();

  // --- Get star color ---
  function getStarColor(s, alpha) {
    const a = alpha || 1;
    if (s.owner === '__collective__') return `rgba(6,214,160,${a})`;
    if (s.star_type === 'convergence') return `rgba(167,139,250,${a})`;
    const c = LAYER_COLORS[s.layer] || LAYER_COLORS.outer;
    // Convert hex to rgba
    const r = parseInt(c.slice(1,3),16), g = parseInt(c.slice(3,5),16), b = parseInt(c.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }

  // --- DRAW ---
  function draw() {
    animFrame++;
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = '#060a10';
    ctx.fillRect(0, 0, W, H);

    // Background stars (parallax)
    for (const bs of bgStars) {
      const [sx, sy] = toScreen(bs.x * 0.3, bs.y * 0.3);
      if (sx < -10 || sx > W+10 || sy < -10 || sy > H+10) continue;
      const flicker = bs.a + Math.sin(animFrame * 0.02 + bs.x) * 0.08;
      ctx.fillStyle = `rgba(200,210,230,${flicker})`;
      ctx.beginPath();
      ctx.arc(sx, sy, bs.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Orbit rings
    if (filters['show-orbits']) {
      const maxR = Math.min(W, H) * 0.42;
      for (let d = 0.2; d <= 1.0; d += 0.2) {
        const [cx, cy] = toScreen(0, 0);
        const r = d * maxR * cam.zoom;
        ctx.strokeStyle = 'rgba(30,40,60,0.3)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 8]);
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        // Label
        ctx.fillStyle = 'rgba(90,99,116,0.5)';
        ctx.font = '10px ' + getComputedStyle(document.body).fontFamily;
        ctx.fillText(d.toFixed(1), cx + r + 4, cy - 4);
      }
    }

    // Nucleus glow
    const [ncx, ncy] = toScreen(0, 0);
    const nucleusR = 12 * cam.zoom;
    const pulse = 1 + Math.sin(animFrame * 0.03) * 0.15;
    const grad = ctx.createRadialGradient(ncx, ncy, 0, ncx, ncy, nucleusR * 4 * pulse);
    grad.addColorStop(0, 'rgba(251,191,36,0.25)');
    grad.addColorStop(0.5, 'rgba(251,191,36,0.06)');
    grad.addColorStop(1, 'rgba(251,191,36,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(ncx, ncy, nucleusR * 4 * pulse, 0, Math.PI * 2);
    ctx.fill();
    // Nucleus dot
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath();
    ctx.arc(ncx, ncy, 4 * cam.zoom, 0, Math.PI * 2);
    ctx.fill();

    // Constellations (hulls)
    if (filters['show-constellations']) {
      for (let ci = 0; ci < constellations.length; ci++) {
        const c = constellations[ci];
        const pts = [];
        for (const sid of c.star_ids) {
          const s = starMap[sid];
          if (s && s._visible) {
            const [sx, sy] = toScreen(s._x, s._y);
            pts.push([sx, sy]);
          }
        }
        if (pts.length < 3) continue;
        const hull = convexHull(pts);
        if (hull.length < 3) continue;

        const colorIdx = ci % CONSTELLATION_COLORS.length;
        ctx.fillStyle = CONSTELLATION_COLORS[colorIdx];
        ctx.strokeStyle = CONSTELLATION_STROKES[colorIdx];
        ctx.lineWidth = 1;

        // Expanded hull (padding)
        const pad = 12 * cam.zoom;
        const centroid = hull.reduce((a, p) => [a[0]+p[0]/hull.length, a[1]+p[1]/hull.length], [0,0]);
        ctx.beginPath();
        for (let i = 0; i < hull.length; i++) {
          const dx = hull[i][0] - centroid[0], dy = hull[i][1] - centroid[1];
          const d = Math.sqrt(dx*dx + dy*dy) || 1;
          const px = hull[i][0] + dx/d * pad, py = hull[i][1] + dy/d * pad;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
    }

    // Edges
    if (filters['show-edges']) {
      for (const e of edges) {
        const sa = starMap[e.source], sb = starMap[e.target];
        if (!sa || !sb || !sa._visible || !sb._visible) continue;
        const [ax, ay] = toScreen(sa._x, sa._y);
        const [bx, by] = toScreen(sb._x, sb._y);
        const alpha = 0.04 + e.weight * 0.12;
        ctx.strokeStyle = `rgba(79,143,247,${alpha})`;
        ctx.lineWidth = 0.5 + e.weight * 1;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.stroke();
      }
    }

    // Stars
    for (const s of stars) {
      if (!s._visible) continue;
      const [sx, sy] = toScreen(s._x, s._y);
      const r = s._r * cam.zoom;
      if (sx < -r*2 || sx > W+r*2 || sy < -r*2 || sy > H+r*2) continue;

      const isHovered = hovered && hovered.id === s.id;
      const color = getStarColor(s);

      // Glow
      if (s.mass > 0.3 || isHovered) {
        const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * 3);
        glow.addColorStop(0, getStarColor(s, isHovered ? 0.4 : 0.15));
        glow.addColorStop(1, getStarColor(s, 0));
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sx, sy, r * 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Star body
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fill();

      // Convergence/collective ring
      if (s.star_type === 'convergence') {
        ctx.strokeStyle = s.owner === '__collective__' ? '#06d6a0' : '#a78bfa';
        ctx.lineWidth = isHovered ? 2.5 : 1.5;
        ctx.beginPath();
        ctx.arc(sx, sy, r + 3 * cam.zoom, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Highlight on hover
      if (isHovered) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sx, sy, r + 2, 0, Math.PI * 2);
        ctx.stroke();
      }

    }

    // --- Adaptive Label System ---
    if (filters['show-labels']) {
      // Label budget scales with zoom: 0 below 0.5, then ramps up
      const labelBudget = cam.zoom < 0.5 ? 0 : Math.floor(5 + (cam.zoom - 0.5) * 30);
      const fontFamily = getComputedStyle(document.body).fontFamily;

      // Collect visible on-screen stars with screen coords
      const candidates = [];
      for (const s of stars) {
        if (!s._visible) continue;
        const [sx, sy] = toScreen(s._x, s._y);
        const r = s._r * cam.zoom;
        if (sx < -r * 2 || sx > W + r * 2 || sy < -r * 2 || sy > H + r * 2) continue;
        candidates.push({ star: s, sx, sy, r });
      }

      // Sort by mass descending — highest mass gets label first
      candidates.sort((a, b) => b.star.mass - a.star.mass);

      // Select top-N by budget; hovered always included regardless of zoom
      const selected = [];
      const selectedIds = new Set();
      if (hovered) {
        const h = candidates.find(c => c.star.id === hovered.id);
        if (h) { selected.push(h); selectedIds.add(h.star.id); }
      }
      for (const c of candidates) {
        if (selected.length >= labelBudget) break;
        if (selectedIds.has(c.star.id)) continue;
        selected.push(c);
        selectedIds.add(c.star.id);
      }

      // Cluster detection — group labels within CLUSTER_DIST px
      const CLUSTER_DIST = 55;
      const clusters = [];
      const used = new Set();
      for (let i = 0; i < selected.length; i++) {
        if (used.has(i)) continue;
        const group = [selected[i]];
        used.add(i);
        for (let j = i + 1; j < selected.length; j++) {
          if (used.has(j)) continue;
          for (const m of group) {
            const dx = m.sx - selected[j].sx, dy = m.sy - selected[j].sy;
            if (Math.sqrt(dx * dx + dy * dy) < CLUSTER_DIST) {
              group.push(selected[j]);
              used.add(j);
              break;
            }
          }
        }
        clusters.push(group);
      }

      // Render labels
      for (const group of clusters) {
        if (group.length <= 2) {
          // Sparse — individual labels
          for (const c of group) {
            const isH = hovered && hovered.id === c.star.id;
            const label = c.star.content
              .replace(/\[CONVERGENCE\]\s*/g, '').replace(/\[COLLECTIVE\]\s*/g, '').slice(0, 30);
            ctx.fillStyle = isH ? '#fff' : 'rgba(209,213,219,0.6)';
            ctx.font = `${Math.max(9, 11 * cam.zoom)}px ${fontFamily}`;
            ctx.textAlign = 'center';
            ctx.fillText(label, c.sx, c.sy + c.r + 14 * cam.zoom);
          }
        } else {
          // Dense cluster — single aggregate label
          const cx = group.reduce((a, c) => a + c.sx, 0) / group.length;
          const cy = group.reduce((a, c) => a + c.sy, 0) / group.length;
          // Try to match a constellation covering this cluster
          const ids = new Set(group.map(c => c.star.id));
          let clusterLabel = '\u2605 ' + group.length + ' estrellas';
          for (const con of constellations) {
            const overlap = con.star_ids.filter(id => ids.has(id)).length;
            if (overlap >= 2 && overlap >= group.length * 0.5) {
              clusterLabel = '\u2B21 ' + (con.id || '').slice(0, 22) + ' (' + group.length + ')';
              break;
            }
          }
          ctx.fillStyle = 'rgba(167,139,250,0.7)';
          ctx.font = `bold ${Math.max(10, 12 * cam.zoom)}px ${fontFamily}`;
          ctx.textAlign = 'center';
          ctx.fillText(clusterLabel, cx, cy - 22 * cam.zoom);

          // Still show hovered star's own label inside the cluster
          if (hovered) {
            const hc = group.find(c => c.star.id === hovered.id);
            if (hc) {
              const label = hc.star.content
                .replace(/\[CONVERGENCE\]\s*/g, '').replace(/\[COLLECTIVE\]\s*/g, '').slice(0, 30);
              ctx.fillStyle = '#fff';
              ctx.font = `${Math.max(9, 11 * cam.zoom)}px ${fontFamily}`;
              ctx.textAlign = 'center';
              ctx.fillText(label, hc.sx, hc.sy + hc.r + 14 * cam.zoom);
            }
          }
        }
      }
      ctx.textAlign = 'start';
    }

    requestAnimationFrame(draw);
  }

  // --- Mouse interaction ---
  canvas.addEventListener('mousedown', e => {
    drag.active = true;
    drag.sx = e.clientX; drag.sy = e.clientY;
    drag.cx = cam.x; drag.cy = cam.y;
    canvas.classList.add('dragging');
  });
  window.addEventListener('mousemove', e => {
    if (drag.active) {
      cam.x = drag.cx - (e.clientX - drag.sx) / cam.zoom;
      cam.y = drag.cy - (e.clientY - drag.sy) / cam.zoom;
    }
    // Hover detection
    const [wx, wy] = toWorld(e.clientX, e.clientY);
    let closest = null, closestDist = Infinity;
    for (const s of stars) {
      if (!s._visible) continue;
      const dx = s._x - wx, dy = s._y - wy;
      const d = Math.sqrt(dx*dx + dy*dy);
      const hitR = s._r / cam.zoom + 5;
      if (d < hitR && d < closestDist) { closest = s; closestDist = d; }
    }
    hovered = closest;
    if (closest) {
      const tt = tooltip;
      tt.style.display = 'block';
      tt.style.left = (e.clientX + 16) + 'px';
      tt.style.top = (e.clientY - 10) + 'px';
      // Clamp to viewport
      const rect = tt.getBoundingClientRect();
      if (rect.right > W) tt.style.left = (e.clientX - rect.width - 16) + 'px';
      if (rect.bottom > H) tt.style.top = (e.clientY - rect.height - 10) + 'px';

      document.getElementById('tt-label').textContent =
        closest.content.replace(/\[CONVERGENCE\]\s*/g, '').replace(/\[COLLECTIVE\]\s*/g, '');
      const typeLabel = closest.owner === '__collective__' ? 'colectiva' :
                        closest.star_type === 'convergence' ? 'convergencia' : 'primaria';
      document.getElementById('tt-meta').innerHTML =
        `<b>masa</b> ${closest.mass.toFixed(4)} · <b>dist</b> ${closest.distance_to_core.toFixed(4)}<br>` +
        `<b>capa</b> ${closest.layer} · <b>tipo</b> ${typeLabel}<br>` +
        `<b>owner</b> ${closest.owner || '–'} · <b>activaciones</b> ${closest.activation_count}`;
    } else {
      tooltip.style.display = 'none';
    }
  });
  window.addEventListener('mouseup', () => {
    drag.active = false;
    canvas.classList.remove('dragging');
  });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    cam.zoom = Math.max(0.15, Math.min(cam.zoom * factor, 8));
  }, { passive: false });

  // Double-click to center on star
  canvas.addEventListener('dblclick', e => {
    if (hovered) {
      cam.x = hovered._x;
      cam.y = hovered._y;
      cam.zoom = Math.max(cam.zoom, 1.5);
    }
  });

  // --- Filter checkboxes ---
  document.querySelectorAll('#hud-controls input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      filters[cb.dataset.filter] = cb.checked;
      applyFilters();
    });
  });

  // --- Load data ---
  async function loadUniverse() {
    // Try to get auth token from localStorage (same as main app)
    const token = localStorage.getItem('vectrax_token') || '';
    try {
      const res = await fetch('/v1/gravitational/universe', {
        headers: { 'Authorization': `Bearer ${token}` },
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      stars = data.stars || [];
      edges = data.edges || [];
      constellations = data.constellations || [];

      if (stars.length === 0) {
        emptyEl.style.display = 'block';
      } else {
        emptyEl.style.display = 'none';
      }

      layoutStars();
      applyFilters();

      // Stats
      const nConv = stars.filter(s => s.star_type === 'convergence' && s.owner !== '__collective__').length;
      const nColl = stars.filter(s => s.owner === '__collective__').length;
      const nPrim = stars.filter(s => s.star_type === 'primary').length;
      statsEl.innerHTML =
        `<b>${stars.length}</b> estrellas · ` +
        `<b>${edges.length}</b> conexiones · ` +
        `<b>${constellations.length}</b> constelaciones` +
        (nConv ? ` · <b>${nConv}</b> convergencias` : '') +
        (nColl ? ` · <b>${nColl}</b> colectivas` : '');

    } catch (err) {
      statsEl.textContent = 'Error cargando universo: ' + err.message;
      emptyEl.style.display = 'block';
    }
  }

  // --- Init ---
  loadUniverse();
  draw();

  // Auto-refresh every 15s
  setInterval(loadUniverse, 15000);

})();
</script>
</body>
</html>
